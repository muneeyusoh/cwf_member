<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ขอรับสวัสดิการ | CWF</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <!-- 🚀 โหลด Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

  <style>
    :root { --fintech-primary: #0F172A; --fintech-accent: #2563EB; --bg-light: #F8FAFC; }
    body { background-color: var(--bg-light); font-family: 'Prompt', sans-serif; color: #1E293B; -webkit-tap-highlight-color: transparent; padding-bottom: 40px; }
    .app-header { background: var(--fintech-primary); background-image: radial-gradient(circle at top right, #1E293B 0%, transparent 60%); color: white; padding: 40px 20px 80px; text-align: center; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; }
    .card-box { background: white; padding: 25px 20px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); max-width: 500px; margin: -40px auto 20px; position: relative; border: 1px solid #E5E7EB; }
    #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
    .welfare-card { border: 1px solid #E2E8F0; border-radius: 16px; padding: 18px 20px; margin-bottom: 12px; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; background: #FFFFFF; }
    .welfare-card.eligible { cursor: pointer; border-left: 4px solid var(--fintech-accent); }
    .welfare-card.eligible:active { transform: scale(0.98); background: #EFF6FF; }
    .welfare-card.ineligible { cursor: not-allowed; opacity: 0.65; border-left: 4px solid #94A3B8; filter: grayscale(100%); }
    .welfare-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; }
    .welfare-card.eligible .welfare-icon { background: #DBEAFE; color: var(--fintech-accent); }
    .welfare-card.ineligible .welfare-icon { background: #F1F5F9; color: #64748B; }
    .form-control { border-radius: 12px; border: 1px solid #CBD5E1; background-color: #F8FAFC; padding: 14px; font-weight: 600; }
    .form-control:focus { background-color: #FFFFFF; border-color: var(--fintech-accent); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15); }
    .btn-fintech { background-color: var(--fintech-primary); color: white; border-radius: 14px; padding: 16px; font-weight: 700; font-size: 1.05rem; border: none; transition: 0.3s; box-shadow: 0 4px 10px rgba(15, 23, 42, 0.2); }
    .doc-upload-box { border: 2px dashed #CBD5E1; border-radius: 16px; padding: 20px; text-align: center; background: #F8FAFC; transition: 0.2s; cursor: pointer; position: relative; }
  </style>
</head>
<body>
<div id="loader">
  <div class="spinner-border mb-3" style="width: 3rem; height: 3rem; color: var(--fintech-primary);" role="status"></div>
  <p class="text-dark fw-bold">กำลังตรวจสอบสิทธิ์ในฐานข้อมูล...</p>
</div>

<div class="app-header" id="headerSection">
  <div class="d-flex align-items-center justify-content-center mb-1 position-relative">
    <button onclick="liff.closeWindow()" class="btn btn-sm btn-outline-light rounded-circle px-2 py-1 border-0 position-absolute" style="left: 0;"><i class="fa-solid fa-arrow-left"></i></button>
    <h4 class="fw-bold mb-0">ขอรับสวัสดิการ</h4>
  </div>
  <p class="text-white-50 small mb-0">เทศบาลตำบลสุคิริน</p>
</div>

<div class="container px-3">
  <div id="welfareListSection" class="card-box" style="display:none;">
    <h6 class="fw-bold text-dark mb-3"><i class="fa-solid fa-list-check text-primary me-2"></i> เลือกประเภทสวัสดิการ</h6>
    <div id="welfareList"></div>
  </div>
  
  <div id="claimFormSection" class="card-box" style="display:none;">
    <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
      <button onclick="goBack()" class="btn btn-light rounded-circle me-3 border px-2 py-1"><i class="fa-solid fa-arrow-left"></i></button>
      <div>
        <h5 class="fw-bold mb-0 text-dark" id="titleWelfare">ชื่อสวัสดิการ</h5>
        <small class="text-primary fw-bold" id="claimMaxBadge">เบิกได้สูงสุด 0 ฿</small>
      </div>
    </div>
    <div class="alert alert-warning border-0 bg-warning bg-opacity-10 text-dark small fw-bold mb-4" style="border-radius: 12px;">
      <i class="fa-solid fa-circle-info text-warning me-1"></i> <span id="docRequirement">เอกสารที่ต้องแนบ</span>
    </div>
    
    <form onsubmit="submitClaim(event)">
      <input type="hidden" id="uid" name="uid"> 
      <input type="hidden" id="fullName" name="fullName"> 
      <input type="hidden" id="welfareName" name="welfareName">
      
      <div class="mb-4">
        <label class="small text-muted fw-bold mb-2">จำนวนเงินที่ขอเบิก (บาท)</label>
        <input type="number" id="claimAmount" name="claimAmount" class="form-control text-primary fs-5" placeholder="0" required>
      </div>
      <div class="mb-4">
        <label class="small text-muted fw-bold mb-2">แนบเอกสาร (ถ่ายรูป หรือ อัปโหลด)</label>
        <div class="doc-upload-box" onclick="document.getElementById('docInput').click()">
          <i class="fa-solid fa-cloud-arrow-up text-primary fs-2 mb-2"></i>
          <h6 class="fw-bold text-dark mb-1">แตะเพื่อเลือกเอกสารทางการแพทย์</h6>
          <small class="text-muted d-block" id="fileNameDisplay">รองรับไฟล์ JPG, PNG</small>
        </div>
        <input type="file" id="docInput" class="d-none" accept="image/*" required onchange="convertImg(this)">
        <input type="hidden" id="docBase64" name="docBase64">
        <input type="hidden" id="docFileName" name="docFileName">
      </div>
      <button type="submit" class="btn btn-fintech w-100 mt-2" id="submitBtn"><i class="fa-solid fa-paper-plane me-2"></i> ยื่นเอกสารขอรับสวัสดิการ</button>
    </form>
  </div>
</div>

<script>
  const LIFF_ID = "2010764982-RCKkyPZG"; // ใช้ LIFF_ID เดิม
  
  // 🔑 ใส่กุญแจ Firebase ของคุณ
  const firebaseConfig = {
    apiKey: "AIzaSyBs1G5k31100g6PeVvU5nUyz0QDB21jHpI",
    authDomain: "smartwelf-f7d81.firebaseapp.com",
    projectId: "smartwelf-f7d81",
    storageBucket: "smartwelf-f7d81.firebasestorage.app",
    messagingSenderId: "114126831149",
    appId: "1:114126831149:web:66ea766f6c558b159442a4",
    measurementId: "G-LGGQC7R7E1"
  };

  if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();
  
  let maxAmt = 0;
  
  // จำลองกฎสวัสดิการของกองทุน (สามารถย้ายไปเก็บใน Firestore ได้ในอนาคต)
  const welfareRulesMock = [
      { welfareName: "สวัสดิการเจ็บป่วย (นอน รพ.)", maxPerClaim: 1000, requiredDocs: "ใบรับรองแพทย์และใบเสร็จรับเงิน", eligibility: "eligible" },
      { welfareName: "สวัสดิการเสียชีวิต", maxPerClaim: 10000, requiredDocs: "ใบมรณบัตรและทะเบียนบ้าน", eligibility: "eligible" },
      { welfareName: "สวัสดิการคลอดบุตร", maxPerClaim: 1500, requiredDocs: "สูติบัตรบุตร", eligibility: "eligible" },
      { welfareName: "สวัสดิการผู้สูงอายุ", maxPerClaim: 500, requiredDocs: "บัตรประชาชน (อายุ 60 ปีขึ้นไป)", eligibility: "ineligible", reason: "อายุยังไม่ถึงเกณฑ์" }
  ];
  
  document.addEventListener("DOMContentLoaded", async () => {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        document.getElementById('uid').value = profile.userId;
        await checkMemberEligibility(profile.userId);
      } else { liff.login(); }
    } catch (err) { 
        document.getElementById('loader').style.display = 'none';
        Swal.fire('Error', 'เซิร์ฟเวอร์ขัดข้อง โปรดลองใหม่', 'error');
    }
  });

  async function checkMemberEligibility(uid) {
      try {
          const docRef = db.collection("members").doc(uid);
          const docSnap = await docRef.get();
          
          document.getElementById('loader').style.display = 'none';
          
          if (docSnap.exists) {
              const data = docSnap.data();
              document.getElementById('fullName').value = data.fullName;
              
              document.getElementById('welfareListSection').style.display = 'block';
              
              let listHtml = "";
              welfareRulesMock.forEach(r => {
                const isOk = r.eligibility === 'eligible';
                const iconHtml = isOk ? '<i class="fa-solid fa-check-circle"></i>' : '<i class="fa-solid fa-lock"></i>';
                const subText = isOk ? `เบิกได้สูงสุด ${r.maxPerClaim} ฿/ครั้ง` : `<i class="fa-solid fa-triangle-exclamation"></i> ${r.reason}`;
                
                listHtml += `
                  <div class="welfare-card ${isOk ? 'eligible' : 'ineligible'}" onclick="${isOk ? `openForm('${r.welfareName}', ${r.maxPerClaim}, '${r.requiredDocs}')` : ''}">
                    <div class="d-flex align-items-center gap-3">
                      <div class="welfare-icon">${iconHtml}</div>
                      <div>
                        <h6 class="mb-0 fw-bold text-dark">${r.welfareName}</h6>
                        <small class="${isOk ? 'text-primary' : 'text-danger'} fw-bold" style="font-size: 0.75rem;">${subText}</small>
                      </div>
                    </div>
                    <div><i class="fa-solid fa-chevron-right text-muted"></i></div>
                  </div>`;
              });
              document.getElementById('welfareList').innerHTML = listHtml;
          } else {
              Swal.fire('ข้อผิดพลาด', 'ไม่พบข้อมูลสมาชิกของคุณในระบบ', 'error').then(()=>liff.closeWindow());
          }
      } catch (error) {
          Swal.fire('Error', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
      }
  }

  function openForm(name, max, docs) {
    document.getElementById('welfareListSection').style.display='none'; 
    document.getElementById('claimFormSection').style.display='block';
    document.getElementById('titleWelfare').innerText = name; document.getElementById('welfareName').value = name;
    document.getElementById('claimMaxBadge').innerText = `วงเงินคงเหลือ: เบิกได้สูงสุด ${max} ฿`; document.getElementById('docRequirement').innerText = "เอกสารประกอบ: " + docs; 
    maxAmt = max; document.getElementById('claimAmount').max = max; document.getElementById('headerSection').style.paddingBottom = "40px"; window.scrollTo(0,0);
  }
  
  function goBack() { document.getElementById('welfareListSection').style.display='block'; document.getElementById('claimFormSection').style.display='none'; document.getElementById('headerSection').style.paddingBottom = "80px"; }

  function convertImg(input) { 
    const f = input.files[0]; if (!f) return;
    document.getElementById('fileNameDisplay').innerText = "แนบไฟล์แล้ว: " + f.name; document.getElementById('fileNameDisplay').classList.replace('text-muted', 'text-success'); document.getElementById('docFileName').value = f.name; 
    const reader = new FileReader(); 
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 1000; let scaleSize = 1;
        if (img.width > MAX_WIDTH) scaleSize = MAX_WIDTH / img.width;
        canvas.width = img.width * scaleSize; canvas.height = img.height * scaleSize;
        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        document.getElementById('docBase64').value = canvas.toDataURL('image/webp', 0.8);
      }
      img.src = e.target.result;
    } 
    reader.readAsDataURL(f); 
  }
  
  async function submitClaim(e) {
    e.preventDefault(); 
    const amt = parseFloat(document.getElementById('claimAmount').value);
    if(amt > maxAmt) { Swal.fire({ toast: true, position: 'top', icon: 'warning', title: `เบิกได้สูงสุดไม่เกิน ${maxAmt} บาท`, showConfirmButton: false, timer: 3000 }); document.getElementById('claimAmount').value = maxAmt; return; }
    
    const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังส่งข้อมูล...';
    const formDataObj = Object.fromEntries(new FormData(e.target));
    
    // เตรียมข้อมูลส่งเข้า Firestore (แฟ้ม claims)
    const claimData = {
        uid: formDataObj.uid,
        fullName: formDataObj.fullName,
        welfareType: formDataObj.welfareName,
        claimAmount: parseFloat(formDataObj.claimAmount),
        docBase64: formDataObj.docBase64 || null,
        status: "รอตรวจสอบ",
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    try {
      // 🚀 บันทึกลงแฟ้ม claims
      await db.collection("claims").add(claimData);
      Swal.fire({ title: 'สำเร็จ', text: 'ส่งคำขอเบิกสวัสดิการเรียบร้อย', icon: 'success', confirmButtonColor: '#10B981' }).then(()=>liff.closeWindow());
    } catch(err) { 
        Swal.fire('Error', 'เซิร์ฟเวอร์ขัดข้อง โปรดลองใหม่', 'error'); 
        btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> ยื่นเอกสารขอรับสวัสดิการ'; 
    }
  }
</script>
</body>
</html>
