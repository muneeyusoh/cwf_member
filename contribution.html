<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สมทบเงินกองทุน | CWF</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { --fintech-primary: #0A2540; --fintech-accent: #3B82F6; --fintech-success: #10B981; --bg-light: #F8FAFC; }
    body { background-color: var(--bg-light); font-family: 'Prompt', sans-serif; color: #1E293B; padding-bottom: 40px; }
    .app-header { background: linear-gradient(135deg, var(--fintech-primary), #1e3a8a); color: white; padding: 30px 20px 50px; text-align: center; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; box-shadow: 0 4px 15px rgba(10, 37, 64, 0.15); }
    #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
    .card-box { background: white; padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); max-width: 500px; margin: -35px auto 20px; position: relative; border: 1px solid #E2E8F0; }
    .capsule-contrib { background: linear-gradient(135deg, #10B981, #059669); border-radius: 18px; padding: 20px 24px; color: white; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; box-shadow: 0 8px 15px -3px rgba(16, 185, 129, 0.3); }
    .outstanding-text { font-size: 0.85rem; font-weight: 700; color: #EF4444; padding-left: 10px; margin-bottom: 24px; }
    .payment-option { border: 2px solid #E2E8F0; border-radius: 16px; padding: 16px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 12px; margin-bottom: 12px; background: #FFFFFF; }
    .payment-option:active { transform: scale(0.98); }
    .payment-option.active { border-color: var(--fintech-accent); background-color: #EFF6FF; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.1); }
    .payment-option .icon-box { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .opt-transfer .icon-box { background: #DBEAFE; color: #2563EB; }
    .opt-cash .icon-box { background: #FEF3C7; color: #D97706; }
    .form-check-input { display: none; }
    .form-control, .form-select { border-radius: 12px; border: 1px solid #CBD5E1; background-color: #F8FAFC; font-size: 0.95rem; padding: 14px; font-weight: 600; }
    .form-control:focus, .form-select:focus { background-color: #FFFFFF; border-color: var(--fintech-accent); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); }
    .btn-fintech { background-color: var(--fintech-primary); color: white; border-radius: 14px; padding: 16px; font-weight: 700; font-size: 1.05rem; border: none; transition: 0.3s; box-shadow: 0 4px 10px rgba(10,37,64,0.3); }
    .dynamic-section { display: none; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div id="loader">
  <div class="spinner-border mb-3" style="width: 3rem; height: 3rem; color: var(--fintech-success);" role="status"></div>
  <p class="text-dark fw-bold">กำลังดึงข้อมูลบัญชีสมทบ...</p>
</div>

<div class="app-header">
  <div class="d-flex align-items-center mb-3">
    <button onclick="liff.closeWindow()" class="btn btn-sm btn-outline-light rounded-circle px-2 py-1 me-2 border-0"><i class="fa-solid fa-arrow-left"></i></button>
    <h5 class="fw-bold mb-0">สมทบเงินกองทุนรายปี</h5>
  </div>
  <p class="opacity-75 small mb-0 text-start ps-4">ระบบเครือข่ายสวัสดิการแห่งชาติ</p>
</div>

<div class="container mb-5">
  <div class="card-box">
    <div class="capsule-contrib text-start">
      <div>
        <small class="opacity-90 d-block fw-bold">ยอดสมทบสะสมแล้ว</small>
        <h3 class="fw-bold mb-0 text-white"><span id="dashTotalContrib">0</span> <span style="font-size: 1.1rem; font-weight: normal;">฿</span></h3>
      </div>
      <div style="font-size: 2.5rem; opacity: 0.8;"><i class="fa-solid fa-piggy-bank"></i></div>
    </div>
    <div class="outstanding-text">
      <i class="fa-solid fa-circle-exclamation me-1"></i> ยอดที่ต้องสมทบ: <span id="debtText" class="fs-5">0</span> บาท
    </div>
    
    <form id="contribForm" onsubmit="submitContrib(event)">
      <input type="hidden" name="action" value="handleContribution">
      <input type="hidden" id="uid" name="uid"> 
      <input type="hidden" id="fullName" name="fullName">
      
      <div class="mb-4">
        <label class="small text-muted fw-bold mb-2">จำนวนเงินที่ต้องการสมทบ (บาท)</label>
        <input type="number" id="amount" name="amount" class="form-control text-primary fs-5" placeholder="0" required oninput="validateAmount(this)">
      </div>
      
      <label class="small text-muted fw-bold mb-2">ช่องทางการสมทบเงิน</label>
      <label class="payment-option opt-transfer" id="lblTransfer">
        <input class="form-check-input" type="radio" name="paymentType" value="transfer" onchange="togglePaymentSection()" required>
        <div class="icon-box"><i class="fa-solid fa-money-bill-transfer"></i></div>
        <div>
          <div class="fw-bold text-dark">โอนเงินเข้าบัญชีกองทุน</div>
          <div class="small text-muted" style="font-size: 0.75rem;">แนบหลักฐานสลิปการโอนเงิน</div>
        </div>
      </label>
      <label class="payment-option opt-cash" id="lblCash">
        <input class="form-check-input" type="radio" name="paymentType" value="cash" onchange="togglePaymentSection()">
        <div class="icon-box"><i class="fa-solid fa-hand-holding-dollar"></i></div>
        <div>
          <div class="fw-bold text-dark">เงินสดผ่านกรรมการ</div>
          <div class="small text-muted" style="font-size: 0.75rem;">ระบุชื่อกรรมการศูนย์ที่รับเงิน</div>
        </div>
      </label>
      
      <div id="transferSection" class="dynamic-section mt-3 p-3 bg-light rounded-4 border">
        <label class="small fw-bold text-primary mb-2"><i class="fa-solid fa-image me-1"></i> อัปโหลดสลิปการโอนเงิน</label>
        <input type="file" class="form-control" id="slipFile" accept="image/*" onchange="convertImg(this)">
        <input type="hidden" id="slipBase64" name="slipBase64">
        <input type="hidden" id="slipFileName" name="slipFileName">
        <small class="text-muted d-block mt-2" style="font-size:0.75rem;">รองรับไฟล์ภาพ JPG, PNG (บีบอัดอัตโนมัติ)</small>
      </div>
      <div id="cashSection" class="dynamic-section mt-3 p-3 bg-light rounded-4 border">
        <label class="small fw-bold text-warning text-dark mb-2"><i class="fa-solid fa-user-tie me-1"></i> เลือกรายชื่อกรรมการที่รับเงิน</label>
        <select class="form-select" id="committeeSelect" name="committeeName">
          <option value="" disabled selected>-- โหลดรายชื่อกรรมการ --</option>
        </select>
      </div>
      
      <button type="submit" class="btn btn-fintech w-100 mt-4" id="submitBtn"><i class="fa-solid fa-paper-plane me-2"></i> ยืนยันทำรายการ</button>
    </form>
  </div>
</div>

<script>
  const LIFF_ID = "2010977535-b13rVtsp"; 
  const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbxDpvQtOu9XX4CpEdZKPJTJN34WLMUBK9344-n-w3I1ul9VwdCLG9-l2-_vXTXoaOM55g/exec"; 
  
  let GAS_API_URL = localStorage.getItem('cwf_user_api'); 
  let maxAllowed = 0;
  let dynamicCommitteeList = [];

  document.addEventListener("DOMContentLoaded", async () => {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        document.getElementById('uid').value = profile.userId;
        
        if (!GAS_API_URL) {
            const routeRes = await fetch(CENTRAL_API_URL, { 
                method: "POST", body: JSON.stringify({ action: "getUserRoute", uid: profile.userId }) 
            }).then(r=>r.json());
            
            if (routeRes.status === 'success') {
                GAS_API_URL = routeRes.apiUrl;
                localStorage.setItem('cwf_user_api', GAS_API_URL);
            } else {
                document.getElementById('loader').style.display = 'none';
                return Swal.fire('แจ้งเตือน', 'คุณยังไม่ได้เป็นสมาชิกกองทุนสวัสดิการ', 'warning').then(()=>liff.closeWindow());
            }
        }
        
        const res = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify({ action: "checkStatus", uid: profile.userId }) }).then(r=>r.json());
        document.getElementById('loader').style.display = 'none';
        
        if(res.status === 'registered') {
          document.getElementById('fullName').value = res.memberData.fullName;
          document.getElementById('dashTotalContrib').innerText = (res.memberData.totalContribution || 0).toLocaleString();
          maxAllowed = res.memberData.outstandingBalance || 0;
          document.getElementById('debtText').innerText = maxAllowed.toLocaleString();
          document.getElementById('amount').max = maxAllowed;
          dynamicCommitteeList = res.memberData.committeeList || ["ไม่มีข้อมูลกรรมการในศูนย์นี้ (โปรดติดต่อแอดมิน)"];
          
          if(maxAllowed <= 0) {
            Swal.fire({ title: 'ยอดเยี่ยม', text: 'คุณสมทบครบถ้วนแล้ว ไม่มียอดค้างชำระในปีนี้ครับ', icon: 'success', confirmButtonColor: '#10B981' }).then(()=>liff.closeWindow());
          }
        } else {
          localStorage.removeItem('cwf_user_api');
          Swal.fire('ข้อผิดพลาด', 'ไม่พบข้อมูลสมาชิกของคุณในระบบ', 'error').then(()=>liff.closeWindow());
        }
      } else { liff.login(); }
    } catch (err) { 
        document.getElementById('loader').style.display = 'none';
        Swal.fire('Error', 'เซิร์ฟเวอร์ขัดข้อง โปรดลองใหม่ภายหลัง', 'error');
    }
  });

  function validateAmount(input) {
    if (parseFloat(input.value) > maxAllowed) {
      input.value = maxAllowed;
      Swal.fire({ toast: true, position: 'top', icon: 'warning', title: `ชำระได้สูงสุด ${maxAllowed} บาท`, showConfirmButton: false, timer: 2500 });
    }
  }

  function togglePaymentSection() {
    const pType = document.querySelector('input[name="paymentType"]:checked').value;
    document.getElementById('lblTransfer').classList.remove('active');
    document.getElementById('lblCash').classList.remove('active');
    
    if (pType === 'transfer') {
      document.getElementById('lblTransfer').classList.add('active');
      document.getElementById('transferSection').style.display = 'block';
      document.getElementById('cashSection').style.display = 'none';
      document.getElementById('slipFile').required = true;
      document.getElementById('committeeSelect').required = false;
    } else {
      document.getElementById('lblCash').classList.add('active');
      document.getElementById('transferSection').style.display = 'none';
      document.getElementById('cashSection').style.display = 'block';
      document.getElementById('slipFile').required = false;
      document.getElementById('committeeSelect').required = true;
      populateCommitteeDropdown();
    }
  }

  function populateCommitteeDropdown() {
    const select = document.getElementById('committeeSelect');
    select.innerHTML = '<option value="" disabled selected>-- โปรดเลือกชื่อกรรมการ --</option>';
    dynamicCommitteeList.forEach(name => {
      const option = document.createElement('option');
      option.value = name; option.text = name; select.appendChild(option);
    });
  }

  function convertImg(input) { 
    const f = input.files[0]; 
    if (!f) return;
    document.getElementById('slipFileName').value = f.name; 
    const reader = new FileReader(); 
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 800; let scaleSize = 1;
        if (img.width > MAX_WIDTH) scaleSize = MAX_WIDTH / img.width;
        canvas.width = img.width * scaleSize; canvas.height = img.height * scaleSize;
        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        document.getElementById('slipBase64').value = canvas.toDataURL('image/webp', 0.7); 
      }
      img.src = e.target.result;
    } 
    reader.readAsDataURL(f); 
  }
  
  async function submitContrib(e) {
    e.preventDefault(); 
    const btn = document.getElementById('submitBtn'); 
    btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังอัปโหลดข้อมูล...';
    
    const formDataObj = Object.fromEntries(new FormData(e.target));
    if (formDataObj.paymentType === 'transfer') {
      formDataObj.paymentMethod = "โอนเงินผ่านธนาคาร";
      if (!formDataObj.slipBase64) {
        Swal.fire('แจ้งเตือน', 'กรุณาแนบสลิปการโอนเงิน', 'warning');
        btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> ยืนยันทำรายการ'; return;
      }
    } else if (formDataObj.paymentType === 'cash') {
      formDataObj.paymentMethod = "เงินสดผ่านกรรมการ (" + formDataObj.committeeName + ")";
      delete formDataObj.slipBase64; delete formDataObj.slipFileName;
    }
    
    try {
      const res = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(formDataObj) }).then(r=>r.json());
      if(res.status === 'success') {
        Swal.fire({ title: 'สำเร็จ', text: 'บันทึกรายการเรียบร้อย คณะกรรมการกำลังตรวจสอบครับ', icon: 'success', confirmButtonColor: '#10B981' }).then(()=>liff.closeWindow());
      } else { Swal.fire('ข้อผิดพลาด', res.message, 'error'); btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> ยืนยันทำรายการ'; }
    } catch (err) {
      Swal.fire('Error', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error'); btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> ยืนยันทำรายการ';
    }
  }
</script>
</body>
</html>
